<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>9.81 파크 관리 시스템 (ICN)</title>
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --surface-2:#f5f6f8;
    --fg:#1b2330; --muted:#69707c; --line:#e8ebef; --line-2:#eef1f4;
    --accent:#245ec3; --accent-soft:#e9f0fb; --accent-weak:#f4f8ff;
    --red:#da222b; --ok:#20a86b;
    --font-display:"Space Grotesk","Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;
    --font-body:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0b0e13; --surface:#12161d; --surface-2:#171c24;
    --fg:#e8ebf0; --muted:#98a2b0; --line:#232a34; --line-2:#1c222b;
    --accent:#5b8cff; --accent-soft:#18233b; --accent-weak:#141b2b;
    --red:#e5686c; --ok:#4cc585; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0b0e13; --surface:#12161d; --surface-2:#171c24;
    --fg:#e8ebf0; --muted:#98a2b0; --line:#232a34; --line-2:#1c222b;
    --accent:#5b8cff; --accent-soft:#18233b; --accent-weak:#141b2b;
    --red:#e5686c; --ok:#4cc585; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:13.5px}
  .layout{display:grid;grid-template-columns:236px 1fr;height:100vh}

  /* 사이드바 */
  .side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .logo{display:flex;align-items:center;gap:8px;padding:16px 18px 14px}
  .logo .mark{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
  .logo .mark b{color:var(--accent)}
  .logo .burger{margin-left:auto;color:var(--muted);font-size:16px;cursor:pointer}
  .prof{padding:2px 18px 14px;border-bottom:1px solid var(--line-2)}
  .prof .r1{display:flex;align-items:center;gap:8px}
  .prof .nm{font-weight:700;font-size:14px}
  .prof .role{font-family:var(--font-display);font-size:9.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 7px;letter-spacing:.04em}
  .prof .em{font-size:11.5px;color:var(--muted);margin-top:3px}
  .msearch{padding:12px 14px}
  .msearch .box{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:22px;padding:9px 14px}
  .msearch input{border:none;background:none;outline:none;font-size:13px;color:var(--fg);width:100%;font-family:var(--font-body)}
  .msearch svg{color:var(--muted);flex-shrink:0}
  .navwrap{overflow:auto;padding:2px 10px 12px;flex:1}
  .grp{margin-bottom:4px}
  .grphead{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;cursor:pointer;color:var(--fg)}
  .grphead .gi{color:var(--accent)}
  .grphead .gt{font-weight:600;font-size:13.5px}
  .grphead .chev{margin-left:auto;color:var(--muted);transition:.15s}
  .grphead:hover{background:var(--surface-2)}
  .nav a{display:block;padding:9px 12px 9px 34px;border-radius:9px;cursor:pointer;text-decoration:none;color:var(--muted);font-size:13px;margin:1px 0}
  .nav a:hover{background:var(--surface-2);color:var(--fg)}
  .nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

  /* 메인 */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:0 18px;height:56px;border-bottom:1px solid var(--line);background:var(--surface)}
  .topbar .sys{font-weight:700;font-size:15px;white-space:nowrap}
  .topbar .tsearch{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
  .topbar .tsearch input{border:none;background:none;outline:none;width:100%;font-size:13px;color:var(--fg);font-family:var(--font-body)}
  .topbar .tsearch svg{color:var(--muted)}
  .topbar .icons{display:flex;align-items:center;gap:6px}
  .iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:var(--surface-2);color:var(--fg)}
  .ustat{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}
  .ustat .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .frame{flex:1;min-height:0;background:var(--bg)}
  iframe{width:100%;height:100%;border:0;display:block}

  .mtabs{display:none}
  @media(max-width:860px){
    .layout{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
    .side{display:none}
    .topbar .sys{font-size:13.5px}.topbar .tsearch{display:none}
    .mtabs{display:flex;gap:6px;overflow:auto;padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
    .mtabs a{white-space:nowrap;padding:7px 12px;border-radius:8px;font-size:12.5px;text-decoration:none;color:var(--fg);border:1px solid var(--line)}
    .mtabs a.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  }
</style>

<div class="layout">
  <!-- 사이드바 -->
  <aside class="side">
    <div class="logo"><span class="mark"><b>9.81</b> PARK</span><span class="burger">≡</span></div>
    <div class="prof">
      <div class="r1"><span class="nm">옵집사</span><span class="role">SUPER</span></div>
    </div>
    <div class="msearch"><div class="box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input placeholder="메뉴 검색"></div></div>
    <div class="navwrap">
      <div class="grp">
        <div class="grphead"><span class="gi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span><span class="gt">판매 관리</span><span class="chev">⌄</span></div>
        <nav class="nav" id="nav">
          <a data-id="psu" data-file="psu.html">PSU 관리</a>
          <a data-id="product" data-file="product.html">상품 관리</a>
          <a data-id="pricing" data-file="pricing.html">가격 정책 관리</a>
          <a data-id="stock" data-file="stock.html">재고 관리</a>
          <a data-id="promo" data-file="promo.html">프로모션 관리</a>
        </nav>
      </div>
    </div>
  </aside>

  <div class="mtabs" id="mtabs"></div>

  <div class="main">
    <div class="topbar">
      <span class="sys">9.81 파크 관리 시스템 <span style="color:var(--muted)">(ICN)</span></span>
      <div class="tsearch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input placeholder="티켓 번호를 입력하세요"></div>
      <div class="icons">
        <button class="iconbtn" title="최근"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
        <button class="iconbtn" title="티켓"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/></svg></button>
        <button class="iconbtn" title="새로고침"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <span class="ustat"><span class="dot"></span>옵집사</span>
      </div>
    </div>
    <div class="frame"><iframe id="view" src="psu.html" title="화면"></iframe></div>
  </div>
</div>

<script>
(function(){
  var items=[
    {id:'psu',file:'psu.html',label:'PSU 관리'},
    {id:'product',file:'product.html',label:'상품 관리'},
    {id:'pricing',file:'pricing.html',label:'가격 정책 관리'},
    {id:'stock',file:'stock.html',label:'재고 관리'},
    {id:'promo',file:'promo.html',label:'프로모션 관리'}
  ];
  var view=document.getElementById('view'), nav=document.getElementById('nav'), mtabs=document.getElementById('mtabs');
  items.forEach(function(it){var a=document.createElement('a');a.textContent=it.label;a.dataset.id=it.id;a.dataset.file=it.file;a.href='#'+it.id;mtabs.appendChild(a);});
  function select(id){
    var it=items.filter(function(x){return x.id===id})[0]||items[0];
    if(view.getAttribute('src')!==it.file) view.setAttribute('src',it.file);
    document.querySelectorAll('#nav a, #mtabs a').forEach(function(a){a.classList.toggle('on',a.dataset.id===id)});
    if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
  }
  document.querySelectorAll('#nav a, #mtabs a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();select(a.dataset.id);});});
  var start=(location.hash||'').replace('#','');
  select(items.some(function(x){return x.id===start})?start:'psu');
})();
</script>
