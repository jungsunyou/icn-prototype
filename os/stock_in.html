<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>입고 이력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="park.css">
<body>
<div class="app">
  <div class="crumb" style="font-size:12px;color:var(--muted)">재고 관리 › 입고 이력</div>
  <div class="top"><h1>입고 이력 <span class="ex">예시 데이터</span></h1></div>
  <div class="card">
    <div class="ch"><label class="fld">▦ <input type="date" id="d0" value="2026-10-13" onchange="render()"> - <input type="date" id="d1" value="2026-11-12" onchange="render()"></label><label class="fld" style="width:300px">⌕ <input id="q" placeholder="부품명, 부품번호" oninput="render()"></label></div>
    <div class="tblwrap"><table><thead><tr><th>No.</th><th>부품명</th><th>부품번호</th><th>구매처</th><th>부품단가</th><th>입고수량</th><th>총액</th><th>입고처리일</th><th>입고 처리자</th></tr></thead><tbody id="tb"></tbody></table></div><div id="pg"></div>
  </div>
  <div class="memo">
    <div class="mh">안내</div>
    <ul>
      <li>재고 관리에서 입고 처리한 기록이에요.</li>
      <li>기간과 부품명 · 부품번호로 찾아요.</li>
      <li>총액 = 부품단가 × 입고수량.</li>
      <li>입고 처리일과 처리자는 입고를 확정한 날짜와 크루예요.</li>
    </ul>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="park.js"></script>
<script>
var S=sLoad();
function render(){var q=$('q').value.trim(),d0=$('d0').value,d1=$('d1').value;var L=S.ins.filter(function(r){var d=r.at.slice(0,10);return d>=d0&&d<=d1&&(!q||(r.no+r.name).indexOf(q)>=0)});
  $('tb').innerHTML=L.length?L.map(function(r,i){return '<tr><td>'+(L.length-i)+'</td><td>'+esc(r.name)+'</td><td class="code">'+r.no+'</td><td>'+esc(r.vendor)+'</td><td class="num">'+won(r.price)+'</td><td class="num">'+r.qty+'</td><td class="num">'+won(r.price*r.qty)+'</td><td class="code">'+r.at+'</td><td>'+r.by+'</td></tr>'}).join(''):'<tr><td colspan="9" class="empty">입고 이력이 없어요</td></tr>';
  $('pg').innerHTML=pager(L.length);}
render();
</script>
</body>
</html>
