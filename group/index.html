<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICN 단체 예약 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 제주 OS(sgp-admin-web) 단체 예약 관리 화면을 코드 기준으로 옮기고 인천 변경분을 반영한 시안. 보라 = 구현 시 제외하는 안내·미정 */
:root{
  --page:#f3f5f9; --surface:#ffffff; --surface-2:#f6f7f9; --fg:#1d2330; --muted:#6b7385; --hint:#a3aab8;
  --line:#e3e7ee; --line-strong:#c7cdd8;
  --primary:#2f6fed; --primary-tint:#eef3fe; --primary-line:#c9d9fb;
  --positive:#16a34a; --warning:#d97706; --negative:#dc2626; --disable:#94a3b8; --violet:#8b5cf6;
  --note:#f1edfd; --note-fg:#5a3fb5; --note-line:#d9cff7;
  --dim:rgba(17,24,39,.42);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0f1218; --surface:#1a1f29; --surface-2:#222835; --fg:#e7eaf0; --muted:#9aa3b5; --hint:#6c7486;
  --line:#2e3545; --line-strong:#3c4558; --primary:#6b9bff; --primary-tint:#1d2a45; --primary-line:#2f4677;
  --positive:#4ade80; --warning:#fbbf24; --negative:#f87171; --disable:#7b8494; --violet:#a78bfa;
  --note:#2a2342; --note-fg:#c6b6ff; --note-line:#43386b; --dim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0f1218; --surface:#1a1f29; --surface-2:#222835; --fg:#e7eaf0; --muted:#9aa3b5; --hint:#6c7486;
  --line:#2e3545; --line-strong:#3c4558; --primary:#6b9bff; --primary-tint:#1d2a45; --primary-line:#2f4677;
  --positive:#4ade80; --warning:#fbbf24; --negative:#f87171; --disable:#7b8494; --violet:#a78bfa;
  --note:#2a2342; --note-fg:#c6b6ff; --note-line:#43386b; --dim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px}
button{font:inherit;color:inherit}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);height:38px;padding:0 12px}
textarea{height:72px;padding:10px 12px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--hint)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
/* app shell */
.app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.logo{font-weight:700;font-size:18px;color:var(--primary);letter-spacing:-.02em}
.me{font-size:12px;color:var(--muted);line-height:1.5}
.menu{display:grid;gap:2px}
.menu a{display:block;padding:9px 10px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-size:14px}
.menu a.on{background:var(--primary-tint);color:var(--primary);font-weight:500}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.top b{font-size:15px}
.top .srch{max-width:260px;margin-left:24px}
.content{padding:20px 24px 40px;display:grid;gap:16px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h1{font-size:20px;margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--primary);color:#fff}
.btn{height:38px;padding:0 16px;border-radius:var(--r);cursor:pointer;border:1px solid var(--line-strong);background:var(--surface)}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.d{color:var(--negative);border-color:var(--negative)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.ml{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat small{color:var(--muted);font-size:13px}
.stat div{font-size:22px;font-weight:700;margin-top:4px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters>*{flex:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.boxh{display:flex;align-items:center;gap:8px;padding:14px 16px}
.boxh b{font-size:15px}
.boxh small{color:var(--muted)}
.tw{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:1280px;font-size:13px}
.list th{background:var(--surface-2);color:var(--muted);font-weight:500;text-align:left;padding:10px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr.r{cursor:pointer}
.list tr.r:hover td{background:var(--surface-2)}
.list td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
.pag{display:flex;justify-content:center;gap:4px;padding:14px}
.pag button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer}
.pag button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.note{background:var(--note);color:var(--note-fg);border:1px solid var(--note-line);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.65}
.note b{font-weight:700}
.note ul{margin:4px 0 0;padding-left:18px}
.kept{color:var(--note-fg);background:var(--note);border-radius:4px;padding:0 4px}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* drawer */
.ov{position:fixed;inset:0;background:var(--dim);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:11;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh b{font-size:16px}
.x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 6px}
.db{flex:1;overflow-y:auto;padding:4px 20px 20px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.sec{font-weight:700;font-size:14px;margin:20px 0 8px}
.ir{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ir span:first-child{width:110px;flex:none;color:var(--muted)}
.og{border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.ogh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border-radius:10px 10px 0 0;font-size:13px}
.oi{padding:10px 12px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:12px}
.oi .l{flex:1;min-width:0}
.oi .rt{text-align:right;color:var(--muted);font-size:12px;line-height:1.6;white-space:nowrap}
.sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.tot{background:var(--primary-tint);border:1px solid var(--primary-line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.tot div span:last-child{color:var(--primary)}
/* modal */
.mwrap{position:fixed;inset:0;z-index:21;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.ov.m{z-index:20}
.modal{width:100%;max-width:600px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.modal.s{max-width:400px}
.mh{display:flex;align-items:center;padding:18px 22px 6px}
.mh b{font-size:18px}
.mb{padding:12px 22px 6px;display:grid;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:16px 22px 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.req{color:var(--negative);margin-left:2px}
.pr{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.prh{display:flex;align-items:center}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
.sm{font-size:12px;color:var(--hint);margin-top:4px}
.cnt{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.cnt.one{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.msgs{display:grid;gap:4px}
.msg{font-size:13px;line-height:1.5}
.msg.danger{color:var(--negative)} .msg.warn{color:var(--warning)} .msg.info{color:var(--muted)}
.adj{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.adjh{display:flex;align-items:center;gap:8px}
.adjh span{font-size:13px;font-weight:500}
.adjh small{font-size:12px;color:var(--muted)}
.tg{margin-left:auto;font-size:12px;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--muted);cursor:pointer}
table.amt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:420px}
.amt th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.amt td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
.amt th:first-child,.amt td:first-child{text-align:left}
.amt input{height:30px;text-align:right;padding:0 8px;font-size:13px}
.amt input.on{border-color:var(--primary);color:var(--primary)}
.rowsum{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rowsum b{color:var(--fg);font-weight:500}
.add{width:100%;font-size:13px;color:var(--primary);background:var(--surface);border:1px dashed var(--primary-line);border-radius:var(--r);height:40px;cursor:pointer;margin-top:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:var(--r);font-size:13px;max-width:calc(100% - 32px)}
.ob{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.obh{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--surface-2)}
.obh b{font-size:13px}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.mini th{font-weight:400;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.mini td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.mini td.n,.mini th.n{text-align:right;font-variant-numeric:tabular-nums}
.mini tr.pair-b td{border-bottom-style:dashed}
.mini input[type=checkbox],.ob input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--primary)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.radio{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.radio input{width:16px;height:16px;margin-top:2px;flex:none;accent-color:var(--primary)}
.radio.on{border-color:var(--primary);background:var(--primary-tint)}
.paybox{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)!important}.side{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top .srch{display:none}}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}.cnt{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:16px}.top{padding:0 16px}.mh,.mb,.mf{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="logo">9.81 PARK</div>
    <div class="me">운영자 계정<br>예약팀</div>
    <nav class="menu" aria-label="메뉴">
      <a href="#">인포데스크</a>
      <a href="#">레이스</a>
      <a href="#">액티비티</a>

      <a href="#">파크 운영 관리</a>

    </nav>
  </aside>
  <div class="main">
    <header class="top"><b>9.81 파크 관리 시스템 (ICN)</b><input class="srch" id="ticketSearch" placeholder="티켓 번호를 입력하세요" aria-label="티켓 번호 검색"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="layer"></div>
<div id="modalLayer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const TODAY='2026-10-08';
const PRODUCTS={race:{name:'[단체] 레이스 포함 패키지',short:'레이스 패키지',base:64000,opt:40000},indoor:{name:'[단체] 실내 패키지',short:'실내 패키지',base:64000}};
const STOCK={'10:00':[40,6],'11:00':[12,2],'13:00':[55,10],'14:00':[30,4],'15:00':[48,8]};
const PTYPE={AGENCY:'여행사',AGENCY_PACKAGE:'여행사PKG',GUIDE:'가이드',AFFILIATE:'제휴',PRIVATE_GROUP:'개별모임',OTHER:'기타'};
const PSTATUS={ACTIVE:['활성','var(--positive)'],CLOSED:['폐업','var(--disable)']};
const GPRODUCTS=[['race','[단체] 레이스 포함 패키지',64000],['indoor','[단체] 실내 패키지',64000]];
const mkP=p=>({type:'AGENCY',status:'ACTIVE',region:'인천',representative:'',address:'',method:'PERCENT',value:0,businessNo:'',contacts:[],products:[],files:{reg:false,card:false,bank:false},memo:'',audits:[{type:'CREATED',regNm:'영업팀 담당자',regDt:'2026-08-20 10:00',changes:[]}],regNm:'영업팀 담당자',regDt:'2026-08-20 10:00',modNm:'',modDt:'',...p});
const AGENCIES=[{id:0,name:'',method:'PERCENT',value:0,status:'ACTIVE',products:[]},
  mkP({id:1,name:'예시여행사',type:'AGENCY',representative:'이○○',address:'인천 중구 ○○로 12',value:10,businessNo:'123-45-*****',contacts:[{name:'이○○ 과장',phone:'010-****-1102',email:'l***@example.com'}],files:{reg:true,card:true,bank:true},memo:'학단 위주',
    audits:[{type:'CREATED',regNm:'영업팀 담당자',regDt:'2026-08-20 10:00',changes:[]},{type:'UPDATED',regNm:'영업팀 담당자',regDt:'2026-09-02 14:21',changes:[{field:'수수료',left:'8',right:'10'}]}],modNm:'영업팀 담당자',modDt:'2026-09-02 14:21'}),
  mkP({id:2,name:'예시투어',type:'AGENCY_PACKAGE',region:'서울',representative:'김○○',address:'서울 중구 ○○길 5',value:15,businessNo:'234-56-*****',contacts:[{name:'김○○ 대리',phone:'010-****-3381',email:'k***@example.com'},{name:'박○○ 사원',phone:'010-****-9920',email:'p***@example.com'}],products:[{prd:'indoor',method:'PERCENT',value:10}],files:{reg:true,card:false,bank:true}}),
  mkP({id:3,name:'한빛관광',type:'AGENCY',region:'경기',representative:'최○○',value:12,businessNo:'345-67-*****',contacts:[{name:'최○○ 팀장',phone:'010-****-4410',email:'c***@example.com'}],files:{reg:true,card:true,bank:false}}),
  mkP({id:4,name:'정○○ 가이드',type:'GUIDE',region:'인천',representative:'정○○',method:'FIXED',value:5000,contacts:[{name:'정○○',phone:'010-****-7712',email:''}],files:{reg:false,card:true,bank:true},memo:'프리랜서 가이드, 일본어 가능'}),
  mkP({id:5,name:'○○카드',type:'AFFILIATE',region:'서울',representative:'한○○',value:0,contacts:[{name:'한○○ 매니저',phone:'010-****-3307',email:'h***@example.com'}]}),
  mkP({id:6,name:'옛날여행',type:'AGENCY',status:'CLOSED',region:'부산',representative:'오○○',value:10,memo:'2026-07 폐업 신고'})];
const fmtComm=a=>!a||!a.id?'-':a.method==='FIXED'?won(a.value)+' (1인)':a.value+'%';
function commUnit(agencyId,key,price){const a=AGENCIES.find(x=>x.id==agencyId);if(!a||!a.id)return 0;const o=a.products.find(x=>x.prd===(key==='opt'?'race':key));const m=o?o.method:a.method,v=o?o.value:a.value;return m==='FIXED'?num(v):price*num(v)/100}
const STATUS={PENDING:['대기','var(--warning)'],REVIEWING:['리체크','var(--violet)'],CONFIRMED:['확정','var(--positive)'],COMPLETED:['완료','var(--primary)'],CANCELED:['취소','var(--negative)']};
const GTYPE={SCHOOL:['학단','var(--primary)'],CORPORATE:['기업','#eab308'],PUBLIC:['공공','#20c997'],AGENCY:['여행사','#ef4444'],AGENCY_PACKAGE:['여행사PKG','#ff6b00'],AFFILIATE:['제휴','#008000'],PRIVATE_GROUP:['개별모임','var(--violet)'],OTHER:['기타','var(--disable)']};
const REGIONS=['서울','부산','대구','인천','광주','대전','울산','세종','경기','충북','충남','전남','경북','경남','제주','강원','전북','국외'];
const COUNTRIES=['중국','대만','홍콩','싱가포르','일본','유럽','미주','동남아','기타'];
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
const num=v=>{const x=parseInt(v,10);return isNaN(x)||x<0?0:x};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dow=d=>'일월화수목금토'[new Date(d+'T00:00:00').getDay()];
const chip=(t,c)=>`<span class="chip" style="color:${c}">${t}</span>`;

let rowSeq=0;

function calc(r,agencyId){
  const p=PRODUCTS[r.prd],race=r.prd==='race';
  const n1=num(r.n1),n2=race?num(r.n2):0,n3=race?num(r.n3):0,drv=n1+n2,pas=n3;
  if(!p)return{race,drv,pas,n1,n2,n3,lines:[],pay:0,dep:0,com:0};
  const c=r.cust,bc=c.bc??commUnit(agencyId,r.prd,p.base),bd=c.bd??Math.max(p.base-bc,0);
  const lines=[{k:'b',name:race?'운전자 (주니어 포함)':'이용자',q:drv,price:p.base,d:bd,c:bc}];
  if(race){const oc=c.oc??commUnit(agencyId,'opt',p.opt),od=c.od??Math.max(p.opt-oc,0);lines.push({k:'o',name:'동승자 옵션',q:pas,price:p.opt,d:od,c:oc})}
  let dep=lines.reduce((s,l)=>s+l.d*l.q,0);const com=lines.reduce((s,l)=>s+l.c*l.q,0);
  if(c.depAll!=null)dep=c.depAll;
  return{race,drv,pas,n1,n2,n3,lines,dep,com,pay:dep+com};
}

function svClick(t){
  const d=t.dataset;
  if(d.sopen&&!t.closest('button')&&t.tagName!=='BUTTON'){S.sdrawer=+d.sopen;renderLayer();return true}
  if(d.ropen&&t.tagName!=='BUTTON'){S.rdrawer=+d.ropen;renderLayer();return true}
  if(d.close==='sdrawer'){S.sdrawer=null;renderLayer();return true}
  if(d.close==='rdrawer'){S.rdrawer=null;renderLayer();return true}
  if(d.s2r){const s=S.surveys.find(x=>x.id==d.s2r);S.modal={kind:'s2r',sid:s.id,draft:{date:'',time:'',headcount:'',memo:''}};renderModal();return true}
  if(d.r2b){const r=S.receipts.find(x=>x.id==d.r2b);S.modal={kind:'r2b',rid:r.id,draft:{agency:r.agency,date:r.date,leader:'',leaderPhone:'',memo:'',rows:[mkRow({slot:''})]}};renderModal();return true}

const OSTAT={PENDING:['주문대기','var(--warning)'],TICKET_PENDING:['발권대기','var(--primary)'],TICKET_PRINTED:['발권완료','var(--positive)'],USE_COMPLETED:['이용완료','var(--disable)'],CANCELED:['취소','var(--negative)']};
const PSTAT={UNPAID:['미결제','var(--negative)'],TEMP_PAID:['가결제','var(--warning)'],ACTUAL_PAID:['결제완료','var(--positive)']};
const SSTAT={PENDING:['정산대상','var(--warning)'],DEFERRED:['정산보류','var(--violet)'],COMPLETED:['정산완료','var(--positive)']};
const METHOD={CARD:'카드',CASH:'현금',DEPOSIT:'계좌이체'};
/* JAM 구성은 ICN Payments 상품 정책 기준, 원가는 재산정 전이라 예시 값 */
const JAM={race:{label:'레이스 패키지',race:2,gen:20},opt:{label:'동승자 옵션',race:2,gen:20},indoor:{label:'실내 패키지',race:0,gen:40}};
const JAM_COST={race:15000,gen:900};
let orderSeq=50120,opSeq=880400,tkSeq=104200;
function initOrd(b,dt){b.ord={rows:{},settle:'PENDING',tax:false,canceled:false,orderDt:dt||TODAY}}
function payRow(b,r,{actual,method,withCom,at}){
  const k=calc(r,b.agency),race=k.race,base=k.lines[0],opt=k.lines[1];
  const unit=l=>withCom?l.d+l.c:l.d;
  const tickets=[];const mk=(role,pair,line,kind)=>tickets.push({no:'T'+(++tkSeq),op:++opSeq,role,pair,kind,paid:Math.round(unit(line)),refund:0,printed:false,printedAt:''});
  if(race){let p=0,left=k.n3;
    for(let i=0;i<k.n2;i++){p++;mk('주니어 운전자',p,base,'race');mk('동승자',p,opt,'opt');left--}
    for(let i=0;i<k.n1;i++){if(left>0){p++;mk('운전자',p,base,'race');mk('동승자',p,opt,'opt');left--}else mk('운전자',null,base,'race')}}
  else for(let i=0;i<k.drv;i++)mk('이용자',null,base,'indoor');
  b.ord.rows[r.id]={orderId:++orderSeq,pay:actual?'ACTUAL_PAID':'TEMP_PAID',method:actual?method:'',withCom,paidAt:at||TODAY,tickets};
}
function ordState(b){
  const o=b.ord,rs=b.rows.filter(r=>r.prd);let paid=0,refund=0,temp=0,tks=[];
  rs.forEach(r=>{const x=o.rows[r.id];if(!x)return;x.tickets.forEach(t=>{paid+=t.paid;refund+=t.refund;tks.push(t)});if(x.pay==='TEMP_PAID')temp+=x.tickets.reduce((s,t)=>s+t.paid-t.refund,0)});
  const unpaid=rs.some(r=>!o.rows[r.id]);
  const pay=unpaid?'UNPAID':rs.some(r=>o.rows[r.id].pay==='TEMP_PAID')?'TEMP_PAID':'ACTUAL_PAID';
  const live=tks.filter(t=>t.refund<t.paid);
  let os=o.canceled?'CANCELED':unpaid||!tks.length?'PENDING':live.every(t=>t.printed)?(b.date<TODAY?'USE_COMPLETED':'TICKET_PRINTED'):'TICKET_PENDING';
  return{os,pay,paid,refund,temp,tks,unpaid};
}
const ticketsOf=b=>b.rows.filter(r=>r.prd&&b.ord.rows[r.id]).flatMap(r=>b.ord.rows[r.id].tickets.map(t=>({...t,_r:r})));
function findTicket(b,no){for(const r of b.rows){const x=b.ord.rows[r.id];if(!x)continue;const t=x.tickets.find(t=>t.no===no);if(t)return{t,x,r}}return null}
function withPartners(b,nos){const out=new Set(nos);nos.forEach(no=>{const f=findTicket(b,no);if(f&&f.t.pair)f.x.tickets.filter(t=>t.pair===f.t.pair).forEach(t=>out.add(t.no))});return[...out]}

function refundModalHTML(){

  const calcOne=f=>{const u=used[f.t.kind]||{race:0,gen:0};const ded=num(u.race)*JAM_COST.race+num(u.gen)*JAM_COST.gen;return Math.max(0,f.t.paid-f.t.refund-ded)};
  const total=items.reduce((s,f)=>s+calcOne(f),0);

    ask('결제 완료',`${P.actual?'결제':'가결제'}되었습니다.\n로봉 티켓 ${fresh.length}장을 지금 발권할까요?`,'발권',()=>{fresh.forEach(x=>{const f=findTicket(b,x.no);f.t.printed=true;f.t.printedAt=NOW});toast('발권 처리되었습니다.')});return true}
  if(d.settle){const to=d.settle;ask(to==='DEFERRED'?'정산 보류':'정산 완료',to==='DEFERRED'?'정산을 보류하시겠습니까?':'정산을 완료하시겠습니까?','확인',()=>{b.ord.settle=to;toast(to==='DEFERRED'?'정산이 보류되었습니다.':'정산이 완료되었습니다.')});return true}
  if('tax' in d){const s=ordState(b);if(s.unpaid||s.temp>0||!['TICKET_PENDING','TICKET_PRINTED','USE_COMPLETED'].includes(s.os)){toast('결제가 모두 끝난 뒤에 발행을 요청할 수 있어요.');return true}
    ask('세금계산서 발행','세금계산서 발행을 요청하시겠습니까?','발행 요청',()=>{b.ord.tax=true;toast('세금계산서 발행이 요청되었습니다.')});return true}
  return false;
}
document.getElementById('layer').addEventListener('change',e=>{
  const t=e.target,b=S.books.find(x=>x.id===S.odrawer);if(!b)return;
  if(t.dataset.sel){const nos=withPartners(b,[t.dataset.sel]);nos.forEach(no=>t.checked?S.sel.add(no):S.sel.delete(no))}
  else if(t.dataset.selrow){b.ord.rows[t.dataset.selrow].tickets.forEach(x=>t.checked?S.sel.add(x.no):S.sel.delete(x.no))}
  else if(t.id==='p-actual')S.pay.actual=t.checked;
  else if(t.id==='p-method')S.pay.method=t.value;
  else if(t.name==='wc')S.pay.withCom=t.value==='1';
  else return;
  renderLayer();
});

/* ---------- 이벤트 ---------- */
document.getElementById('content').addEventListener('input',e=>{
  const id=e.target.id;if(id&&id.startsWith('of-')){S.of[id.slice(3)]=e.target.value;render();return}if(id&&id.startsWith('sf-')){S.sf[id.slice(3)]=e.target.value;render();return}if(id&&id.startsWith('rf-')){S.rf[id.slice(3)]=e.target.value;render();return}if(id&&id.startsWith('pf-')){S.pf[id.slice(3)]=e.target.value;render();return}if(id&&id.startsWith('cf-')){S.cf[id.slice(3)]=e.target.value;render();return}if(!id||!id.startsWith('f-'))return;S.f[id.slice(2)]=e.target.value;render();
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close],[data-open],[data-oopen],[data-sopen],[data-ropen],[data-popen],[data-cday],[data-cbook],[data-mclose]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  if(t.dataset.act==='reset'){S.f={q:'',status:'',agency:'',type:'',region:'',from:'',to:''};render();return}
  if(t.dataset.act==='csv'){toast('CSV 다운로드는 시안에서 동작하지 않아요. 날짜를 선택해야 내려받을 수 있어요.');return}
  if('new' in t.dataset){if(S.tab==='dashboard'){S.modal={kind:'goal',mode:'direct',tp:'',ta:'',draft:JSON.parse(JSON.stringify(S.goals))};renderModal()}else if(S.tab==='vendor'){S.modal={kind:'pform',draft:{id:null,name:'',type:'',status:'ACTIVE',region:'',address:'',method:'PERCENT',value:'',businessNo:'',representative:'',contacts:[{name:'',phone:'',email:''}],products:[],files:{reg:false,card:false,bank:false},memo:''}};renderModal()}else if(S.tab==='booking'||S.tab==='calendar'){S.modal={kind:'form',draft:blankDraft()};renderModal()}else if(S.tab==='survey'){S.modal={kind:'sform',draft:{id:null,date:'',time:'',groupName:'',type:'',visitor:'',phone:'',region:'',country:'',agency:0,staff:'',processed:'',memo:''}};renderModal()}else if(S.tab==='receipt'){S.modal={kind:'rform',draft:{id:null,date:'',time:'',groupName:'',type:'',contact:'',phone:'',region:'',country:'',status:'PENDING',headcount:'',agency:0,staff:'예약팀 담당자',confirmStaff:'',processDate:'',processStatus:'PENDING',inquiry:'',memo:''}};renderModal()}else toast('이 탭은 다음 단계에서 만들어요.');return}
  if(t.dataset.order){e.stopPropagation();const b=S.books.find(x=>x.id==t.dataset.order);
    S.modal={kind:'confirm',title:'주문생성',text:`${b.groupName} 예약에 대한 주문을 생성하시겠습니까?`,ok:'생성',run:()=>{b.status='COMPLETED';initOrd(b);toast('주문이 생성되었습니다.')}};renderModal();return}
  if(t.dataset.edit){const b=S.books.find(x=>x.id==t.dataset.edit);S.modal={kind:'form',draft:cloneBook(b)};renderModal();return}
  if(t.dataset.delete){const b=S.books.find(x=>x.id==t.dataset.delete);
    S.modal={kind:'confirm',danger:true,title:'예약 삭제',text:`${b.groupName} 예약을 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.`,ok:'삭제',run:()=>{S.books=S.books.filter(x=>x!==b);S.drawer=null;toast('예약이 삭제되었습니다.')}};renderModal();return}
  if(t.dataset.close==='drawer'){S.drawer=null;renderLayer();return}
  if(t.dataset.close==='odrawer'){S.odrawer=null;renderLayer();return}
  if(t.dataset.oopen){S.odrawer=+t.dataset.oopen;S.sel=new Set();S.more={};S.pay={actual:true,method:'',withCom:true};renderLayer();return}
  if(t.dataset.cmove){const [y,m]=S.cm.split('-').map(Number);const d=new Date(y,m-1+(+t.dataset.cmove),1);S.cm=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();return}
  if(t.dataset.cday){S.cday=t.dataset.cday;renderLayer();return}
  if(t.dataset.close==='cday'){S.cday=null;renderLayer();return}
  if(t.dataset.cbook){const b=S.books.find(x=>x.id==t.dataset.cbook);S.cday=null;if(b.ord){S.odrawer=b.id;S.sel=new Set();S.more={};S.pay={actual:true,method:'',withCom:true}}else S.drawer=b.id;renderLayer();return}
  if(dClick(t))return;
  if(pClick(t))return;
  if(svClick(t))return;
  if(orderClick(t))return;
  if(t.dataset.open&&!e.target.closest('button')){S.drawer=+t.dataset.open;renderLayer();return}
  if('mclose' in t.dataset){S.modal=null;renderModal();return}
  if('mok' in t.dataset){const run=S.modal.run;S.modal=null;run();renderModal();render();return}
  if('addrow' in t.dataset){S.modal.draft.rows.push(mkRow({}));renderModal();document.getElementById('prd-'+rowSeq)?.focus();return}
  if(t.dataset.delrow){const d=S.modal.draft;d.rows=d.rows.filter(r=>r.id!=t.dataset.delrow);renderModal();return}
  if(t.dataset.tg){const r=S.modal.draft.rows.find(x=>x.id==t.dataset.tg);r.open=!r.open;renderModal();return}
  if('msave' in t.dataset){save();return}
});
document.getElementById('modalLayer').addEventListener('input',e=>{
  const t0=e.target;
  if(S.modal&&S.modal.kind==='refund'&&t0.dataset.used){const [kd,jk]=t0.dataset.used.split('.');S.modal.used[kd][jk]=t0.value;renderModal(true);return}
  if(S.modal&&S.modal.kind==='actual'){if(t0.id==='am')S.modal.method=t0.value;if(t0.dataset.pick){const id=+t0.dataset.pick;S.modal.pick.has(id)?S.modal.pick.delete(id):S.modal.pick.add(id);renderModal()}return}
  if(!S.modal||!['form','addorder','r2b','sform','rform','s2r'].includes(S.modal.kind))return;const d=S.modal.draft,t=e.target;
  if(t.dataset.d){d[t.dataset.d]=t.dataset.d==='agency'?+t.value:t.value;if(t.dataset.d==='region'&&t.value!=='국외')d.country='';
    if(['date','agency','region'].includes(t.dataset.d))renderModal(true);return}
  const rowEl=t.closest('[data-row]');if(!rowEl)return;const r=d.rows.find(x=>x.id==rowEl.dataset.row);
  if(t.dataset.f){r[t.dataset.f]=t.value;if(t.dataset.f==='prd'){r.slot='';r.n2='';r.n3='';r.cust={bd:null,bc:null,od:null,oc:null,depAll:null}}
    if(t.dataset.f!=='memo')renderModal(true);return}
  if(t.dataset.c){const x=parseFloat(t.value);r.cust[t.dataset.c]=t.value===''||isNaN(x)?null:Math.max(0,x);if(t.dataset.c==='depAll')renderModal(true)}
});
document.getElementById('modalLayer').addEventListener('change',e=>{if(e.target.dataset.c&&e.target.dataset.c!=='depAll')renderModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=S.modal.kind==='pprod'?S.modal.parent:null;renderModal()}else if(S.drawer||S.odrawer||S.sdrawer||S.rdrawer||S.pdrawer||S.cday){S.drawer=S.odrawer=S.sdrawer=S.rdrawer=S.pdrawer=S.cday=null;renderLayer()}}});
function save(){
  const d=S.modal.draft;
  if(!d.date)return toast('이용예정일을 선택해 주세요.');
  if(!d.time)return toast('이용시간을 선택해 주세요.');
  if(!d.groupName.trim())return toast('단체명을 입력해 주세요.');
  if(d.region==='국외'&&!d.country)return toast('국가를 선택해 주세요.');
  if(!d.reserver.trim())return toast('단체 담당자명을 입력해 주세요.');
  if(!d.rows.some(r=>r.prd))return toast('상품을 1개 이상 선택해 주세요.');
  if(d.rows.some(r=>r.prd&&calc(r,d.agency).drv===0))return toast('모든 상품의 인원을 넣어 주세요.');
  {const i=d.rows.findIndex(r=>r.prd&&pairErr(calc(r,d.agency)));if(i>=0)return toast(`상품 ${i+1}: ${pairErr(calc(d.rows[i],d.agency))}`)}
  if(d.rows.some(r=>r.prd&&!r.slot))return toast('모든 상품의 탑승 시간을 선택해 주세요.');
  d.rows=d.rows.filter(r=>r.prd);
  if(d.id){const i=S.books.findIndex(x=>x.id===d.id);d.modNm='예약팀 담당자';d.modDt=TODAY+' 15:30';S.books[i]=d;toast('예약이 수정되었습니다.')}
  else{const nb=mkBook({...d,rows:[]});nb.rows=d.rows;nb.regDt=TODAY+' 15:30';S.books.push(nb);toast('예약이 등록되었습니다.')}
  S.modal=null;renderModal();render();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('role')==='button')e.target.click()});
render();
</script>
